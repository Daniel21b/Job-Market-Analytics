services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skill_analytics
      POSTGRES_USER: skill_analytics
      POSTGRES_PASSWORD: skill_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_analytics -d skill_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skill_analytics:skill_analytics@postgres:5432/skill_analytics
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skill_analytics:skill_analytics@postgres:5432/skill_analytics
      REDIS_URL: redis://redis:6379/0
      SKILL_TAXONOMY_PATH: /app/config/skill_taxonomy.csv
      SPARK_MASTER_URL: local[*]
      MINIMUM_CANONICAL_SKILLS: "1"
    volumes:
      - ./data:/data
      - ./notebooks/data:/data/legacy:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
